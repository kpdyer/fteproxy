# Dependabot configuration
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Python dependencies (pyproject.toml: dependencies + the test extra)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python-dependencies:
        patterns:
          - "*"
    ignore:
      # libfte is 0.x: a minor bump is a wire-format break (0.3 -> 0.4 was),
      # and Dependabot would rewrite the fte>=0.4.0,<0.5.0 cap to admit it.
      # Moving the fte line is a coordinated release, never a bot PR.
      - dependency-name: "fte"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # GitHub Actions used in workflows (grouped into a single PR)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
        # Release-only actions need manual review; keep their PRs separate.
        exclude-patterns:
          - "pypa/gh-action-pypi-publish"
          - "actions/upload-artifact"
          - "actions/download-artifact"
