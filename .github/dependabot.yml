# Dependabot configuration
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Python dependencies (pyproject.toml: dependencies + the test extra)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python-dependencies:
        patterns:
          - "*"
    ignore:
      # Review libfte minor/major updates for wire compatibility before changing
      # the version cap. The 0.3-to-0.4 transition changed the wire format.
      - dependency-name: "fte"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # GitHub Actions used in workflows (grouped into a single PR)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
