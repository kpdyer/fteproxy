name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"

    - name: Run full test suite
      run: python -m pytest --timeout=300

  package:
    name: Package smoke test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'

    - name: Build distributions
      run: |
        python -m pip install --upgrade pip
        pip install build twine
        python -m build
        twine check dist/*

    - name: Verify sdist contents
      run: >-
        python -c "import glob, tarfile;
        names = tarfile.open(glob.glob('dist/*.tar.gz')[0]).getnames();
        assert not any('/fteproxy/tests/' in name for name in names),
        'the sdist must not contain repository-only tests'"

    - name: Install and exercise the wheel
      working-directory: /tmp
      run: |
        python -m pip install --force-reinstall "${{ github.workspace }}"/dist/*.whl
        python -c "import importlib.util; from importlib.resources import files; assert importlib.util.find_spec('fteproxy.tests') is None; assert files('fteproxy.defs').joinpath('20260903.json').is_file()"
        fteproxy --version
        fteproxy formats
        fteproxy defs-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Lint with flake8
      run: flake8 fteproxy --count --select=E9,F63,F7,F82 --show-source --statistics

  ci-success:
    # Aggregate gate. This single check is the required status check for branch
    # protection. It passes only if every required job above succeeded, so the
    # required-checks list never needs updating when the matrix changes.
    name: CI Success
    if: always()
    needs: [tests, package, lint]
    runs-on: ubuntu-latest
    steps:
    - name: Fail if any required job did not succeed
      if: >-
        contains(needs.*.result, 'failure') ||
        contains(needs.*.result, 'cancelled') ||
        contains(needs.*.result, 'skipped')
      run: |
        echo "One or more required jobs did not succeed:"
        echo "  tests   = ${{ needs.tests.result }}"
        echo "  package = ${{ needs.package.result }}"
        echo "  lint    = ${{ needs.lint.result }}"
        exit 1
    - name: All required jobs succeeded
      run: echo "All required CI jobs succeeded."
