name: Tests

on:
  push:
    branches: [ master, main ]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"

    - name: Run unit tests
      run: |
        python -m pytest fteproxy/tests/test_python3.py fteproxy/tests/test_record_layer.py -v --tb=short

    - name: Run basic import test
      run: |
        python -c "import fteproxy; print('fteproxy version:', fteproxy.__version__)"

  system-tests:
    name: System Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"

    - name: Run system tests (client/server)
      run: |
        python -m pytest fteproxy/tests/test_system.py -v --tb=short --timeout=300

    - name: Run relay integration test
      run: |
        python -m pytest fteproxy/tests/test_relay.py -v --tb=short --timeout=180

  example-tests:
    name: Example Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"

    - name: Run example tests
      run: |
        python -m pytest fteproxy/tests/test_examples.py -v --tb=short --timeout=300

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 fteproxy --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 fteproxy --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

  ci-success:
    # Aggregate gate. This single check is the required status check for branch
    # protection on the default branch. It passes only if every matrix job above succeeded,
    # so the required-checks list never needs updating when the matrix changes.
    name: CI Success
    if: always()
    needs: [unit-tests, system-tests, example-tests, lint]
    runs-on: ubuntu-latest
    steps:
    - name: Fail if any required job did not succeed
      if: >-
        contains(needs.*.result, 'failure') ||
        contains(needs.*.result, 'cancelled') ||
        contains(needs.*.result, 'skipped')
      run: |
        echo "One or more required jobs did not succeed:"
        echo "  unit-tests    = ${{ needs.unit-tests.result }}"
        echo "  system-tests  = ${{ needs.system-tests.result }}"
        echo "  example-tests = ${{ needs.example-tests.result }}"
        echo "  lint          = ${{ needs.lint.result }}"
        exit 1
    - name: All required jobs succeeded
      run: echo "All required CI jobs succeeded."
